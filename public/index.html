<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="江戶亂鬥">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>江戶亂鬥傳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--red:#d82800;--gold:#f8b800}
html,body{margin:0;height:100%;background:#000;color:#fcfcfc;font-family:'DotGothic16','PingFang TC','Microsoft JhengHei',monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
#app{display:flex;flex-direction:column;align-items:center;height:100%}
#hud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:6px 8px;box-sizing:border-box;font-size:14px;background:#000;border-bottom:2px solid #fcfcfc}
#hud .nm{color:var(--gold)}
#hpbar{width:90px;height:10px;border:2px solid #fcfcfc;background:#000;position:relative}
#hpfill{position:absolute;inset:0;width:100%;background:#58d854}
#hud .money{color:var(--gold)}
#hud .sc{margin-left:auto}
#hud .peace{color:#58d854}
#mute{background:none;border:1px solid #fcfcfc;color:#fcfcfc;font-size:12px;padding:0 6px;cursor:pointer}
#stage{position:relative;overflow:hidden;background:#000}
#cv{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(18px,5vw,34px);color:#fcfcfc;text-shadow:3px 3px 0 #000,-2px -2px 0 #000;pointer-events:none;opacity:0;transition:opacity .3s}
#banner small{display:block;font-size:.5em;color:#58d854}
#toast{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);background:#000;border:2px solid #fcfcfc;padding:4px 12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#shop{position:absolute;inset:6% 8%;background:#000;border:3px double #fcfcfc;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:clamp(12px,2.6vw,16px)}
#shop[hidden]{display:none}
#shop h2{margin:0 0 4px;font-size:1.2em;color:var(--gold);font-weight:normal}
#shop .row{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border:1px solid transparent;cursor:pointer}
#shop .row.sel{border-color:var(--gold);background:#3c1800}
#shop .row .d{color:#bcbcbc;font-size:.85em;flex:1;text-align:right}
#shop .row .p{color:var(--gold);min-width:3.5em;text-align:right}
#shop .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#bcbcbc;font-size:.85em}
#shop .foot button{background:var(--red);color:#fff;border:2px solid #fcfcfc;padding:2px 12px;font-size:1em}
#pad{display:none;width:100%;max-width:700px;justify-content:space-between;align-items:center;padding:10px 22px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box;flex:1}
body.touch #pad{display:flex}
body.touch.land #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;flex:none;pointer-events:none;opacity:.6;padding:8px 28px}
body.touch.land #pad>*{pointer-events:auto}
#dpad{width:148px;height:148px;position:relative;touch-action:none}
#dpad .a{position:absolute;background:#3c3c3c;border:2px solid #7c7c7c;box-sizing:border-box}
#dpad .a.on{background:var(--gold)}
#dpad .u{left:50px;top:0;width:48px;height:54px;border-radius:6px 6px 0 0}
#dpad .d{left:50px;bottom:0;width:48px;height:54px;border-radius:0 0 6px 6px}
#dpad .l{left:0;top:50px;width:54px;height:48px;border-radius:6px 0 0 6px}
#dpad .r{right:0;top:50px;width:54px;height:48px;border-radius:0 6px 6px 0}
#dpad .c{left:50px;top:50px;width:48px;height:48px;background:#3c3c3c;position:absolute}
#btns{display:grid;grid-template-columns:72px 72px;grid-template-rows:64px 72px;gap:6px 12px}
#btns button{border-radius:50%;border:3px solid #fcfcfc;color:#fff;font-size:22px;width:72px;height:72px;touch-action:none;padding:0}
#btns .s{grid-column:1;grid-row:1;background:#7c2c9c;width:62px;height:62px;justify-self:center;position:relative}
#btns .s.cd{filter:grayscale(1) brightness(.6)}
#btns .s span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#f8b800}
#btns .j{grid-column:2;grid-row:1;background:#00a800;width:62px;height:62px;justify-self:center}
#btns .p{grid-column:1;grid-row:2;background:var(--red)}
#btns .k{grid-column:2;grid-row:2;background:#0058f8}
#btns button.on{filter:brightness(1.6)}
#lobby{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;z-index:10}
#lobby h1{font-weight:normal;font-size:clamp(34px,9vw,64px);margin:0;color:#fcfcfc;text-shadow:4px 4px 0 var(--red)}
#lobby .sub{color:var(--gold);letter-spacing:.3em}
#lobby input{font-family:inherit;font-size:20px;background:#000;color:#fff;border:2px solid #fcfcfc;padding:6px 10px;width:200px;text-align:center}
#lobby button{font-size:22px;background:var(--red);color:#fff;border:3px solid #fcfcfc;padding:6px 28px;cursor:pointer}
#lobby .help{font-size:13px;color:#dcdcdc;max-width:560px;width:100%}
#lobby .keys{border-collapse:collapse;width:100%;text-align:left}
#lobby .keys td{padding:4px 6px;border-bottom:1px solid #3c2c1c;vertical-align:middle}
#lobby .keys td:nth-child(2){white-space:nowrap;color:#fcfcfc}
#lobby .keys small{display:block;color:#9c9c9c;font-size:11px}
#lobby .kb{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;border:2px solid #fcfcfc;color:#fff;font-weight:normal;font-size:16px}
#lobby .kb.dp{border-radius:6px;background:#3c3c3c}#lobby .kb.bp{background:var(--red)}#lobby .kb.bk{background:#0058f8}#lobby .kb.bj{background:#00a800}#lobby .kb.bs{background:#7c2c9c}
#lobby .note{margin-top:8px;color:#f8b800;font-size:12px;line-height:1.6}
#custom{display:flex;gap:14px;align-items:center;background:#140c08;border:2px solid #7c5c3c;padding:8px 12px}
#pv{width:128px;height:144px;image-rendering:pixelated;background:#c8905c;border:2px solid #fcfcfc}
#opts{display:grid;grid-template-columns:auto 26px 6.5em 26px;gap:4px 4px;align-items:center;font-size:15px}
#opts .lb{color:#f8b800;text-align:right;padding-right:4px}
#opts .v{text-align:center}
#opts button{font-size:14px;padding:0;width:26px;height:26px;background:#3c2c1c;color:#fff;border:1px solid #bcbcbc;cursor:pointer}
#lobby{overflow-y:auto}
#net{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#000;border:2px solid #f8b800;color:#f8b800;padding:8px 16px;font-size:15px;z-index:5;white-space:nowrap}
#net[hidden]{display:none}
#install{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#bcbcbc;max-width:380px}
#install[hidden],#install [hidden]{display:none}
#lobby #installBtn{font-size:16px;background:#3c2c1c;border:2px solid #f8b800;color:#f8b800;padding:4px 18px}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);box-sizing:border-box}
body.touch.land #pad{padding-left:calc(28px + env(safe-area-inset-left));padding-right:calc(28px + env(safe-area-inset-right))}
#lobby .err{color:#f87858;min-height:1em}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="nm" id="hName">-</span>
    <span>體力</span><div id="hpbar"><div id="hpfill"></div></div>
    <span class="money" id="hMoney">¥0</span>
    <span id="hStat">攻0 防0 速0</span>
    <span id="hHold"></span>
    <span id="hSkill"></span>
    <span class="sc" id="hScene"></span>
    <span id="hOnline"></span>
    <button id="mute">♪</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="256" height="192"></canvas>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="net" hidden></div>
    <div id="shop" hidden></div>
  </div>
  <div id="pad">
    <div id="dpad"><div class="a u"></div><div class="a d"></div><div class="a l"></div><div class="a r"></div><div class="c"></div></div>
    <div id="btns"><button class="s" data-k="s">技<span id="cdTxt"></span></button><button class="j" data-k="j">跳</button><button class="p" data-k="p">拳</button><button class="k" data-k="k">蹴</button></div>
  </div>
</div>
<div id="lobby">
  <div class="sub">大江戶 ・ 熱血亂鬥</div>
  <h1>江戶亂鬥傳</h1>
  <input id="nameIn" maxlength="8" placeholder="輸入名字" autocomplete="off">
  <div id="custom"><canvas id="pv" width="64" height="72"></canvas><div id="opts"></div></div>
  <button id="startBtn">出 陣</button>
  <div id="install" hidden><button id="installBtn" hidden>安裝成 App</button><span id="iosHint" hidden>iPhone：點 Safari 下方的「分享」→「加入主畫面」，就能像 App 一樣全螢幕開啟</span></div>
  <div class="err" id="err"></div>
  <div class="help">
    <table class="keys">
      <tr><td><b class="kb dp">✚</b></td><td>十字鍵<small>（電腦：方向鍵／WASD）</small></td><td>移動；連按兩下 ◀ 或 ▶ ＝奔跑</td></tr>
      <tr><td><b class="kb bp">拳</b></td><td>出拳<small>（電腦：J）</small></td><td>連打第三下是上勾拳；站在物品上＝撿起；拿著東西＝揮打；在店門口＝進店</td></tr>
      <tr><td><b class="kb bk">蹴</b></td><td>踢<small>（電腦：K）</small></td><td>拿著東西＝丟出去；奔跑中＝衝刺踢</td></tr>
      <tr><td><b class="kb bj">跳</b></td><td>跳躍<small>（電腦：L／空白鍵）</small></td><td>空中按拳或蹴＝飛踢；奔跑中跳＝跳上一樓屋簷</td></tr>
      <tr><td><b class="kb bs">技</b></td><td>必殺技<small>（電腦：U）</small></td><td>「旋風斬」打周圍所有人，每 10 秒一次</td></tr>
    </table>
    <div class="note">商店街禁止打鬥・打倒敵人撿小判・離開街道再回來敵人會重生・被打倒會掉一半的錢</div>
  </div>
</div>
<script>
'use strict';
// ================= 基本資料 =================
const SCN = [
  { name: '寺社境內', w: 640 }, { name: '城下大通', w: 768 }, { name: '商店街', w: 768, peace: true },
  { name: '長屋小巷', w: 640 }, { name: '河原', w: 768 }, { name: '港口碼頭', w: 768 },
];
const SHOPS = {
  food: { name: '茶屋　福壽庵', list: [['dango', '糰子', 10, '體力 +25'], ['soba', '蕎麥麵', 30, '體力 +70'], ['sushi', '特上壽司', 80, '體力全滿・上限 +10']] },
  weapon: { name: '武器屋　鐵心堂', list: [['bokken', '木刀', 40, '揮打威力大'], ['shuriken', '手裏劍×3', 30, '可連續投擲'], ['stone', '飛礫', 5, '投擲用石頭']] },
  gear: { name: '道具屋　萬屋', list: [['band', '紅鉢卷', 120, '攻擊 +2'], ['waraji', '韋駄天草鞋', 100, '速度 +1'], ['kusari', '鎖帷子', 150, '防禦 +2']] },
};
const SHOP_X = { food: 150, weapon: 384, gear: 620 };
const HOLD_NAME = { stone: '石頭', bokken: '木刀', barrel: '酒樽', shuriken: '手裏劍', chair: '椅子', bucket: '水桶', rock: '岩石' };
const OVER = new Set(['stone', 'barrel', 'chair', 'bucket', 'rock']);
const GY = 124;
// ================= DOM =================
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');
function fit() {
  const land = innerWidth > innerHeight;
  document.body.classList.toggle('land', land);
  const hud = $('hud');
  const padH = isTouch && !land ? Math.max(180, innerHeight * 0.3) : 0;
  const ah = innerHeight - hud.offsetHeight - padH, aw = innerWidth;
  const s = Math.max(1, Math.min(aw / 256, ah / 192));
  $('stage').style.width = Math.floor(256 * s) + 'px';
  $('stage').style.height = Math.floor(192 * s) + 'px';
  hud.style.width = Math.max(Math.floor(256 * s), Math.min(aw, 320)) + 'px';
}
addEventListener('resize', fit); fit();

// ================= 音效（紅白機風方波） =================
let AC = null, muted = false, bgmOn = true;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function beep(f, d, type = 'square', vol = 0.06, slide = 0, when = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, vol = 0.08) {
  if (!AC || muted) return;
  const b = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
  const s = AC.createBufferSource(), v = AC.createGain(); v.gain.value = vol; s.buffer = b; s.connect(v); v.connect(AC.destination); s.start();
}
const SFX = {
  special: () => { beep(200, 0.5, 'sawtooth', 0.06, 900); noise(0.4, 0.1); beep(1200, 0.3, 'square', 0.03, -800, 0.25); },
  break: () => { noise(0.15, 0.14); beep(120, 0.15, 'square', 0.05, -60); },
  hit: () => { noise(0.08, 0.12); beep(180, 0.08, 'square', 0.05, -100); },
  whiff: () => noise(0.04, 0.03),
  jump: () => beep(300, 0.12, 'square', 0.04, 400),
  coin: () => { beep(988, 0.06, 'square', 0.04); beep(1319, 0.12, 'square', 0.04, 0, 0.06); },
  throw: () => beep(600, 0.1, 'triangle', 0.08, -400),
  ko: () => beep(400, 0.4, 'square', 0.05, -350),
  pick: () => beep(660, 0.05, 'square', 0.04),
  buy: () => { beep(784, 0.08, 'square', 0.04); beep(1047, 0.15, 'square', 0.04, 0, 0.08); },
  no: () => beep(150, 0.2, 'square', 0.05),
};
// 和風五聲音階 BGM
const BGM_M = [74, 76, 79, 81, 79, 76, 74, 0, 81, 83, 86, 83, 81, 79, 76, 0, 74, 76, 79, 76, 74, 71, 69, 0, 71, 74, 76, 79, 76, 74, 74, 0];
const BGM_B = [50, 50, 57, 57, 55, 55, 52, 52];
const BGM_PEACE = [79, 0, 76, 0, 74, 76, 79, 0, 81, 0, 79, 76, 74, 0, 0, 0];
let bgmStep = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
setInterval(() => {
  if (!AC || muted || !bgmOn || !joined) return;
  const peace = SCN[sceneIdx] && SCN[sceneIdx].peace;
  const mel = peace ? BGM_PEACE : BGM_M;
  const n = mel[bgmStep % mel.length];
  if (n) beep(mtof(n), peace ? 0.3 : 0.16, 'square', 0.025);
  if (bgmStep % 4 === 0) beep(mtof(BGM_B[(bgmStep >> 2) % 8] - 12), 0.35, 'triangle', 0.08);
  if (!peace && bgmStep % 2 === 1) noise(0.02, 0.015);
  bgmStep++;
}, 150);
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '×' : '♪'; };

// ================= 點陣工具 =================
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); }
function txt(c, s, x, y, col, size = 10) { c.font = size + "px 'DotGothic16','PingFang TC',monospace"; c.fillStyle = col; c.textBaseline = 'top'; c.fillText(s, x, y); }
function srand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function dith(c, x, y, w, h, col, ph = 0) { c.fillStyle = col; for (let j = 0; j < h; j++) for (let i = (j + ph) & 1; i < w; i += 2) c.fillRect(x + i, y + j, 1, 1); }
function dith4(c, x, y, w, h, col) { c.fillStyle = col; for (let j = 0; j < h; j += 2) for (let i = (j & 2); i < w; i += 4) c.fillRect(x + i, y + j, 1, 1); }
function disc(c, cx, cy, r, col, sy = 1) { c.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const hw = Math.round(Math.sqrt(r * r - dy * dy)); c.fillRect(cx - hw, cy + Math.round(dy * sy), hw * 2 + 1, Math.max(1, Math.ceil(sy))); } }
function shade(hex, f = 0.65) { const n = parseInt(hex.slice(1), 16); const g = v => Math.min(255, Math.max(0, Math.round(v * f))).toString(16).padStart(2, '0'); return '#' + g(n >> 16) + g((n >> 8) & 255) + g(n & 255); }
function outline(cv, col = '#1c0c08') {
  const c = cv.getContext('2d'), W = cv.width, H = cv.height, im = c.getImageData(0, 0, W, H), d = im.data, src = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) src[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  const rgb = [parseInt(col.slice(1, 3), 16), parseInt(col.slice(3, 5), 16), parseInt(col.slice(5, 7), 16)];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (src[i]) continue;
    if ((x > 0 && src[i - 1]) || (x < W - 1 && src[i + 1]) || (y > 0 && src[i - W]) || (y < H - 1 && src[i + W])) { d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255; }
  }
  c.putImageData(im, 0, 0); return cv;
}

// ================= 街景元件 =================
const RF = { t: '#4c5878', b: '#647494', l: '#9cacc8', d: '#28304a' }, RF2 = { t: '#343c50', b: '#46506a', l: '#7884a0', d: '#181c2c' };
const NOREN = ['#2850c8', '#24245c', '#b41c0c', '#0c7c40', '#7c2c9c', '#c87c00'];
const PLASTER = ['#f4f0e4', '#ecdcb4', '#f4f0e4', '#dcd4c4'];
function skyBands(c, w, h, cols) { const bh = h / cols.length; cols.forEach((col, i) => { const y = Math.round(i * bh); R(c, 0, y, w, Math.ceil(bh) + 1, col); if (i) { dith(c, 0, y - 2, w, 2, col); dith4(c, 0, y - 5, w, 3, col); } }); }
function cloud(c, x, y, s = 1) {
  const p = [[0, 6, 10], [12, 2, 12], [26, 5, 9], [36, 8, 7]];
  for (const [dx, dy, r] of p) disc(c, x + dx * s, y + dy, r * s, '#c4d8f0', 0.6);
  for (const [dx, dy, r] of p) disc(c, x + dx * s, y + dy - 2, r * s - 1, '#eef4fc', 0.55);
  for (const [dx, dy, r] of p) disc(c, x + dx * s - 2, y + dy - 4, Math.max(1, r * s - 4), '#fcfcfc', 0.5);
}
function mountains(c, w, y, col, hi, rnd) {
  for (let x = -40; x < w + 40; x += 60 + rnd() * 70) {
    const h = 18 + rnd() * 34, bw = 70 + rnd() * 70;
    for (let i = 0; i < h; i++) { const hw = (i / h) * bw / 2; R(c, x - hw, y - h + i, hw * 2, 1, col); if (i < h * 0.3) R(c, x - hw, y - h + i, Math.max(1, hw * 0.8), 1, hi); }
  }
}
function roof(c, x, y, w, h, ext, P) {

}
